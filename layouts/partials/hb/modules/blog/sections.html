<div class="row mb-4">
  <div class="col-12">
    <ul class="nav nav-tabs">
      <li class="nav-item">
        <a
          class="nav-link active"
          aria-current="page"
          href="{{ .RelPermalink }}">
          {{ partial "hb/functions/render-title" (dict "Page" .CurrentSection "Title" .CurrentSection.Title) }}
        </a>
      </li>
      {{- range .Sections }}
        <li class="nav-item">
          <a class="nav-link" href="{{ .RelPermalink }}">{{ partial "hb/functions/render-title" (dict "Page" . "Title" .Title) }}</a>
        </li>
      {{- end }}
    </ul>
  </div>
</div>
